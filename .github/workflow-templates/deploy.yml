name: Deploy (template)

# This is a starting-point template. Copy it into .github/workflows/, rename it,
# and fill in the deploy steps for your project. The get-version action handles
# version extraction for all branch types automatically:
#
#   release/working branch, exactly on tag  →  1.1.0  or  1.1.0-rc2
#   feature/hotfix branch, between tags     →  1.1.0-rc2-4-gabcdef

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is required — git describe needs the full tag history
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/repository/get-version

      - name: Show version info
        run: |
          echo "Version:     ${{ steps.version.outputs.version }}"
          echo "Pre-release: ${{ steps.version.outputs.is-prerelease }}"

      # ----------------------------------------------------------------
      # Add your deploy steps below.
      # Use ${{ steps.version.outputs.version }} as the build identifier.
      #
      # Docker example:
      #   - run: |
      #       docker build -t myapp:${{ steps.version.outputs.version }} .
      #       docker push myapp:${{ steps.version.outputs.version }}
      #
      # Helm example:
      #   - run: |
      #       helm upgrade myapp ./chart \
      #         --set image.tag=${{ steps.version.outputs.version }}
      #
      # You can also gate production deploys on is-prerelease:
      #   - if: steps.version.outputs.is-prerelease == 'false'
      #     run: helm upgrade myapp-prod ...
      # ----------------------------------------------------------------
